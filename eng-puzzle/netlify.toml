# The site is the single index.html at the repo root; the functions exist because
# two things cannot happen in the browser — the WayForPay merchant secret with the
# subscription write, and the OpenAI key with the quota that guards it.

[build]
  publish = "."
  command = "echo 'static site, nothing to build'"
  functions = "netlify/functions"

[build.environment]
  # ai.js uses global fetch/FormData/Blob, which need Node 18+
  NODE_VERSION = "20"

[functions]
  node_bundler = "esbuild"

# Telegram.WebApp.openLink() відкриває лише звичайне посилання, а WayForPay
# чекає POST із підписаною формою — цю форму збирає функція за цією адресою
[[redirects]]
  from = "/pay"
  to = "/.netlify/functions/pay-redirect"
  status = 200

[[redirects]]
  from = "/paid"
  to = "/.netlify/functions/paid-return"
  status = 200

# Нагадування розсилаються щогодини; яке саме — вирішує сама функція,
# зокрема тихі години з 22:00 до 9:00 за Києвом
[functions."tg-notify"]
  schedule = "@hourly"
