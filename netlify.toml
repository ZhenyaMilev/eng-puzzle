# The site is the single index.html at the repo root; the functions exist because
# two things cannot happen in the browser — the WayForPay merchant secret with the
# subscription write, and the OpenAI key with the quota that guards it.

[build]
  publish = "."
  command = "echo 'static site, nothing to build'"
  functions = "netlify/functions"

[build.environment]
  # ai.js uses global fetch/FormData/Blob, which need Node 18+
  NODE_VERSION = "20"

[functions]
  node_bundler = "esbuild"

# Нагадування розсилаються щогодини; яке саме — вирішує сама функція,
# зокрема тихі години з 22:00 до 9:00 за Києвом
[functions."tg-notify"]
  schedule = "@hourly"
